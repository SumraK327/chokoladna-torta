<header class="header">
  <div class="container header__container">
    <div class="header__logo">
      <a href="#main">
        <img src="./img/logo.png" alt="" />
      </a>
    </div>

    <nav class="menu header__menu" id="header__menu" aria-label="Главное меню">
      <ul class="menu__list">
        <li class="menu__item"><a href="#air-mag" class="menu__link" lang="en">Air Mag</a></li>
        <li class="menu__item"><a href="#sizes" class="menu__link">Размеры</a></li>
        <li class="menu__item"><a href="#specifications" class="menu__link">Характеристики</a></li>
        <li class="menu__item"><a href="#top-models" class="menu__link">Другие ТОП модели</a></li>
      </ul>
    </nav>

    <div class="header__controls">
      <a href="#" class="header__order">Сделать заказ</a>
      <div class="header__actions">
        <button class="header__actions-button" title="Поиск" aria-label="Поиск">
          <svg>
            <use href="./img/icons/sprite.svg#search"></use>
          </svg>
        </button>

        <button class="header__actions-button" title="Корзина" aria-label="Корзина">
          <svg>
            <use href="./img/icons/sprite.svg#cart"></use>
          </svg>
        </button>

        <button class="header__burger burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
          <svg>
            <use class="burger__icon-menu" href="./img/icons/sprite.svg#menu-burger"></use>
            <use class="burger__icon-cross" href="./img/icons/sprite.svg#menu-cross"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
