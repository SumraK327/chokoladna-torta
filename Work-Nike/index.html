<!doctype html>
<html class="html" lang="ru">
  <head>
    <link rel="stylesheet" href="./css/index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/nike-con-favicon.svg" type="image/x-icon" />

    <title>Tortik vs Nike</title>
  </head>

  <body class="body">
    <div class="back">
      <a href="https://sumrak327.github.io/chokoladna-torta/">
        <button class="button">← Назад</button>
      </a>
    </div>
    <div id="header" class="header header--fixed"></div>
    <main class="main">
      <section class="hero">
        <div class="container hero__conrainer">
          <header class="hero__header">
            <il class="hero__benefits-list">
              <ul class="hero__benefits-iatem">
                стиль
              </ul>
              <ul class="hero__benefits-iatem">
                cкорость
              </ul>
            </il>
            <h1 class="hero__title">Nike <span class="hero__title-accent">air</span> mag</h1>
          </header>
          <img src="./img/nike-air-mag-1.png" alt="" class="hero__img" />
          <footer class="hero__footer">
            <a href="#" class="hero__details">
              Подробнее
              <svg>
                <use class="hero__details-icon" href="./img/icons/sprite.svg#arrow-right"></use>
              </svg>
            </a>
          </footer>
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script>
      fetch("header.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("header").innerHTML = h;

          // Обновляем спрайт
          const sprite = document.querySelector("use");
          if (sprite) {
            const href = sprite.getAttribute("href");
            sprite.setAttribute("href", "");
            setTimeout(() => sprite.setAttribute("href", href), 10);
          }
        });

      fetch("footer.html")
        .then((r) => r.text())
        .then((f) => (document.getElementById("footer").innerHTML = f));
    </script>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
