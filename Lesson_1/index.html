<!DOCTYPE html>
<html lang="ru">

<head>
	<script>
		const base = document.createElement('base');
		const path = window.location.pathname;
		const parts = path.split('/').filter(p => p); // убираем пустые части
		if (parts.length > 0) {
			base.href = '/' + parts[0] + '/';
		} else {
			base.href = '/';
		}
		document.head.appendChild(base);
	</script>
	<link rel="stylesheet" href="Style.css">
